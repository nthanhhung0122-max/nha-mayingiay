name: Auto Nha May In Giay 24/7 (All Accounts)

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */5 * * *'

concurrency:
  group: nhamayingiay-all
  cancel-in-progress: true

jobs:
  run-nhamayingiay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon colorama

      - name: Run all accounts (Acc 1 -> Acc 4) in single runner
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          WORKFLOW_FILE: "nhamayingiay.yml"
          GH_PAT: ${{ secrets.GH_PAT }}
          MAX_RUNTIME_SECONDS: "19800"
        run: |
          python run_all.py

      - name: Tu dong ban giao ca tiep theo (Handover Chaining 24/7)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Kich hoat ca chay tiep theo..."
          sleep 10
          gh workflow run nhamayingiay.yml --repo "${{ github.repository }}" || echo "Handover triggered."
