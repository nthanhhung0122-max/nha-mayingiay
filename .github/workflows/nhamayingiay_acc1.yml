name: Auto Nha May In Giay - Acc 1 (hungzai22)

on:
  workflow_dispatch:
  schedule:
    - cron: '3 */5 * * *'

concurrency:
  group: nhamayingiay-acc1
  cancel-in-progress: true

jobs:
  run-nhamayingiay-acc1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon colorama

      - name: Chay Auto Nha May In Giay - Acc 1 (hungzai22)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          WORKFLOW_FILE: "nhamayingiay_acc1.yml"
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python auto_nhamayingiay.py --acc 1

      - name: Tu dong ban giao ca tiep theo (Handover Chaining 24/7)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Kich hoat ca chay tiep theo cho Acc 1..."
          sleep 10
          gh workflow run nhamayingiay_acc1.yml --repo "${{ github.repository }}" || echo "Handover triggered."
